/* ====== CSS RESET & VARIABLES ====== */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}

:root {
--primary-color: #6366f1;
--primary-dark: #4f46e5;
--secondary-color: #ec4899;
--accent-color: #f59e0b;
--success-color: #10b981;
--danger-color: #ef4444;
--dark-bg: #0f172a;
--dark-card: #1e293b;
--light-bg: #f8fafc;
--light-card: #ffffff;
--text-dark: #1e293b;
--text-light: #64748b;
--border-color: #e2e8f0;
--shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
--shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
--gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
--gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
--gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
--gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
}

body {
font-family: 'Poppins', sans-serif;
background: var(--light-bg);
color: var(--text-dark);
line-height: 1.6;
overflow-x: hidden;
transition: background 0.3s ease, color 0.3s ease;
}

body.dark-mode {
background: var(--dark-bg);
color: #e2e8f0;
}

body.dark-mode .card,
body.dark-mode .notification-card,
body.dark-mode .assignment-card,
body.dark-mode .note-card,
body.dark-mode .pdf-card,
body.dark-mode .qp-card {
background: var(--dark-card);
color: #e2e8f0;
border-color: #334155;
}

body.dark-mode .navbar {
background: rgba(15, 23, 42, 0.95);
border-bottom: 1px solid #334155;
}

body.dark-mode .search-box input {
background: var(--dark-card);
color: #e2e8f0;
border-color: #334155;
}

body.dark-mode .filter-btn {
background: var(--dark-card);
color: #e2e8f0;
border-color: #334155;
}

body.dark-mode .filter-btn.active {
background: var(--primary-color);
color: white;
}

body.dark-mode .footer {
background: var(--dark-card);
border-top: 1px solid #334155;
}

body.dark-mode .contact-form input,
body.dark-mode .contact-form textarea,
body.dark-mode .contact-form select {
background: var(--dark-bg);
color: #e2e8f0;
border-color: #334155;
}

/* ====== ANNOUNCEMENT BANNER ====== */
.announcement-banner {
background: var(--gradient-2);
color: white;
text-align: center;
padding: 12px 20px;
font-size: 14px;
font-weight: 500;
position: relative;
animation: slideDown 0.5s ease;
}

.announcement-banner .close-banner {
position: absolute;
right: 20px;
top: 50%;
transform: translateY(-50%);
background: rgba(255, 255, 255, 0.2);
border: none;
color: white;
width: 25px;
height: 25px;
border-radius: 50%;
cursor: pointer;
font-size: 16px;
line-height: 1;
}

@keyframes slideDown {
from {
transform: translateY(-100%);
opacity: 0;
}
to {
transform: translateY(0);
opacity: 1;
}
}

/* ====== NAVIGATION ====== */
.navbar {
background: rgba(255, 255, 255, 0.95);
backdrop-filter: blur(10px);
padding: 15px 0;
position: sticky;
top: 0;
z-index: 1000;
box-shadow: var(--shadow);
border-bottom: 1px solid var(--border-color);
}

.nav-container {
max-width: 1200px;
margin: 0 auto;
padding: 0 20px;
display: flex;
justify-content: space-between;
align-items: center;
}

.logo {
font-size: 24px;
font-weight: 700;
background: var(--gradient-1);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

.nav-menu {
display: flex;
list-style: none;
gap: 30px;
align-items: center;
}

.nav-menu a {
text-decoration: none;
color: var(--text-dark);
font-weight: 500;
font-size: 15px;
transition: color 0.3s;
position: relative;
}

body.dark-mode .nav-menu a {
color: #e2e8f0;
}

.nav-menu a::after {
content: '';
position: absolute;
bottom: -5px;
left: 0;
width: 0;
height: 2px;
background: var(--primary-color);
transition: width 0.3s;
}

.nav-menu a:hover::after {
width: 100%;
}

.dark-mode-toggle {
background: var(--primary-color);
border: none;
color: white;
width: 40px;
height: 40px;
border-radius: 50%;
cursor: pointer;
font-size: 18px;
display: flex;
align-items: center;
justify-content: center;
transition: transform 0.3s, background 0.3s;
}

.dark-mode-toggle:hover {
transform: scale(1.1);
background: var(--primary-dark);
}

.hamburger {
display: none;
flex-direction: column;
cursor: pointer;
gap: 5px;
}

.hamburger span {
width: 25px;
height: 3px;
background: var(--primary-color);
border-radius: 3px;
transition: all 0.3s;
}

.btn-primary {

}

.btn-primary:hover {

}

.btn-outline {
background: transparent;

}

.btn-outline:hover {
background: white;

}

.btn-success {
background: var(--success-color);
color: white;
}

.btn-danger {

color: white;
}

.btn-accent {
background: var(--accent-color);
color: white;
}

.btn:hover {

box-shadow: var(--shadow-lg);
}

/* ====== CONTAINER ====== */
.container {
max-width: 1200px;
margin: 0 auto;
padding: 60px 20px;
}

.section-title {
text-align: center;
font-size: 36px;
margin-bottom: 15px;
font-weight: 700;
background: var(--gradient-1);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
background-clip: text;
}

.section-subtitle {
text-align: center;
color: var(--text-light);
margin-bottom: 50px;
font-size: 18px;
}

/* ====== FILTERS ====== */
.filters {
display: flex;
gap: 10px;
flex-wrap: wrap;
justify-content: center;
margin-bottom: 40px;
}

.filter-btn {
padding: 10px 25px;
border: 2px solid var(--border-color);
background: white;
border-radius: 50px;

font-size: 14px;
font-weight: 500;
color: var(--text-dark);
transition: all 0.3s;
}

.filter-btn:hover,
.filter-btn.active {
background: var(--primary-color);
color: white;
border-color: var(--primary-color);
transform: translateY(-2px);
}

/* ====== CARDS GRID ====== */
.cards-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
gap: 30px;
margin-bottom: 40px;
}

.card {
background: white;
border-radius: 20px;
padding: 25px;
box-shadow: var(--shadow);
transition: all 0.3s;
border: 1px solid var(--border-color);
position: relative;
overflow: hidden;
}

.card::before {
content: '';
position: absolute;
top: 0;
left: 0;
right: 0;
height: 4px;
background: var(--gradient-1);
transform: scaleX(0);
transition: transform 0.3s;
}

.card:hover {
transform: translateY(-10px);
box-shadow: var(--shadow-lg);
}

.card:hover::before {
transform: scaleX(1);
}

.card .badge {
display: inline-block;
padding: 5px 15px;
border-radius: 50px;
font-size: 12px;
font-weight: 600;
margin-bottom: 10px;
}

.badge-new {
background: var(--danger-color);
color: white;
animation: pulse 2s infinite;
}

@keyframes pulse {
0%, 100% {
transform: scale(1);
}
50% {
transform: scale(1.05);
}
}

.badge-sem {
background: var(--gradient-3);
color: white;
}

.badge-subject {
background: var(--accent-color);
color: white;
}

.card h3 {
font-size: 20px;
margin-bottom: 10px;
color: var(--text-dark);
}

body.dark-mode .card h3 {
color: #e2e8f0;
}

.card .meta {
display: flex;
flex-wrap: wrap;
gap: 15px;
margin: 15px 0;
font-size: 14px;
color: var(--text-light);
}

.card .meta span {
display: flex;
align-items: center;
gap: 5px;
}

.card p {
color: var(--text-light);
font-size: 14px;
line-height: 1.6;
margin-bottom: 20px;
}

.card .actions {
display: flex;
gap: 10px;
flex-wrap: wrap;
}

.btn-sm {
padding: 8px 20px;
font-size: 13px;
}

/* ====== NOTIFICATION CARDS ====== */
.notification-card {
background: white;
border-left: 4px solid var(--primary-color);
border-radius: 12px;
padding: 20px;
margin-bottom: 20px;
box-shadow: var(--shadow);

}

.notification-card:hover {

}

.notification-card .notification-header {

}

margin-bottom: 5px;
}

.notification-card .date {
font-size: 13px;

}

.notification-card .category {

color: white;
padding: 4px 12px;
border-radius: 20px;
font-size: 12px;
font-weight: 600;
}

/* ====== STATS SECTION ====== */
.stats {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
gap: 30px;
margin-bottom: 60px;
}

.stat-card {
background: white;
border-radius: 20px;
padding: 30px;
text-align: center;
box-shadow: var(--shadow);
transition: all 0.3s;

}

body.dark-mode .stat-card {

border-color: #334155;
}

.stat-card:hover {

.stat-card .icon {

margin-bottom: 15px;
}

.stat-card h3 {
font-size: 32px;
margin-bottom: 5px;
color: var(--primary-color);
}

.stat-card p {

}

outline: none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
border-color: var(--primary-color);
